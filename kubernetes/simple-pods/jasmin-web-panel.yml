# ============================================================================
# Jasmin Web Panel(页面管理功能)—— Django 管理面板 + Celery + PostgreSQL
# ----------------------------------------------------------------------------
# 来源:jasmin-web-panel 的 docker-compose.yml,这里把它「k8s 化」并接到本集群
#       已有的 jasmin-core / redis-server 上。
#
# 新增组件:
#   jasmin-webdb      (PostgreSQL, replicas:1, 有状态)  ── 面板自身的业务库
#   jasmin-web        (Django/Gunicorn, replicas:1)     ── Web 管理界面(:8000)
#   jasmin-web-celery (Celery worker, replicas:1)       ── 后台任务(broker=Redis)
#
# 复用集群已有服务(无需新建):
#   redis-server      ── Django 缓存 + Celery broker/result;用 DB 1 与 core 的 DB 0 隔离
#   jasmin-cli:8990   ── jCli telnet,面板通过它下发 用户/组/路由/连接器 等管理命令(主通道)
#   jasmin-http-api   ── 可选,HTTP 发送 API
#   jasmin-smpp-api   ── 可选,SMPP 发送
#
# 对外访问:NodePort 30800 -> 容器 8000(浏览器打开 http://<任一节点IP>:30800)
#
# 重要说明:
#   * DEBUG 沿用官方 docker-compose 的取值 "0"。django-environ 中 bool("0")==True,
#     因此实际 DEBUG=True —— 这是面板用 Django 的 static() 直接吐静态资源所必需的
#     (镜像未内置 whitenoise / nginx,详见 config/urls.py)。保持与官方一致。
#   * 默认管理员账号由镜像 entrypoint 的 `manage.py samples` 在首次迁移后创建。
#   * 提交日志(submit_log)页面需另跑 sms_logger 才有数据,默认页面为空(见文件末尾)。
# ============================================================================

# ----------------------------------------------------------------------------
# 1) PostgreSQL —— 面板业务库,固定单副本
#    strategy=Recreate:避免滚动更新时两个 PG 同时抢同一 hostPath 数据目录。
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jasmin-webdb
  namespace: jasmin
  labels:
    name: jasmin-webdb
    k8s.kuboard.cn/name: jasmin-webdb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: jasmin-webdb
  template:
    metadata:
      labels:
        name: jasmin-webdb
    spec:
      containers:
        - name: postgres
          image: postgres:18.0-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: pg-port
          envFrom:
            - secretRef:
                name: jasmin-webdb-secret
          env:
            # hostPath/PVC 挂在 data 根目录时,用子目录做 PGDATA 可避开 lost+found 导致的初始化报错
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: webdb-data
              mountPath: /var/lib/postgresql/data
            - name: webdb-init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: webdb-data
          # 注意:hostPath 是节点本地的,Pod 漂移到别的节点会丢库。
          # 生产环境建议换成基于真实 StorageClass 的 PVC。
          hostPath:
            path: /opt/jasmin/webdb
            type: DirectoryOrCreate
        - name: webdb-init
          configMap:
            name: jasmin-webdb-init
---
apiVersion: v1
kind: Service
metadata:
  name: jasmin-webdb
  namespace: jasmin
  labels:
    name: jasmin-webdb
    k8s.kuboard.cn/name: jasmin-webdb
spec:
  type: ClusterIP
  selector:
    name: jasmin-webdb
  ports:
    - name: pg
      port: 5432
      targetPort: pg-port
      protocol: TCP
---
# ----------------------------------------------------------------------------
# 2) jasmin-web —— Django/Gunicorn 管理界面
#    镜像 entrypoint 每次启动都会 migrate + collectstatic + 起 gunicorn;
#    用 initContainer 先等 PG 就绪,避免 entrypoint(set -e)在库没起时反复 Crash。
#    固定单副本:migrate 每 Pod 都会跑,多副本会有迁移竞争。
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jasmin-web
  namespace: jasmin
  labels:
    name: jasmin-web
    k8s.kuboard.cn/name: jasmin-web
spec:
  replicas: 1
  selector:
    matchLabels:
      name: jasmin-web
  template:
    metadata:
      labels:
        name: jasmin-web
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z jasmin-webdb 5432; do echo 'waiting for jasmin-webdb:5432'; sleep 2; done"]
      containers:
        - name: web
          # 本地自建镜像(源码: /Users/Git/jasmin-web-panel2605242043),与上游 tarekaec/jasmin_web_panel 区分
          image: jasmin-web-panel2605242043:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: jasmin-web-config
            - secretRef:
                name: jasmin-web-secret
          readinessProbe:
            httpGet:
              path: /api/health_check
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health_check
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  annotations: {}
  labels:
    name: jasmin-web
    k8s.kuboard.cn/name: jasmin-web
  name: jasmin-web
  namespace: jasmin
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      nodePort: 30800
      port: 8000
      protocol: TCP
      targetPort: http
  selector:
    name: jasmin-web
  sessionAffinity: None
  type: NodePort
---
# ----------------------------------------------------------------------------
# 3) jasmin-web-celery —— Celery worker(broker/result = Redis;无对外端口)
#    用镜像自带的 celery 入口脚本,等价 docker-compose 里的 jasmin-celery 服务。
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jasmin-web-celery
  namespace: jasmin
  labels:
    name: jasmin-web-celery
    k8s.kuboard.cn/name: jasmin-web-celery
spec:
  replicas: 1
  selector:
    matchLabels:
      name: jasmin-web-celery
  template:
    metadata:
      labels:
        name: jasmin-web-celery
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z jasmin-webdb 5432; do echo 'waiting for jasmin-webdb:5432'; sleep 2; done"]
      containers:
        - name: celery
          # 与 web 共用同一本地镜像,仅用命令覆盖入口跑 celery worker
          image: jasmin-web-panel2605242043:local
          imagePullPolicy: IfNotPresent
          # 覆盖镜像默认 ENTRYPOINT,改跑 celery worker
          command: ["bash", "./docker-entrypoint-celery.sh"]
          envFrom:
            - configMapRef:
                name: jasmin-web-config
            - secretRef:
                name: jasmin-web-secret
---
# ============================================================================
# ConfigMaps & Secrets
# ============================================================================
# 非敏感配置:把面板接到集群里已有的 redis-server / jasmin-cli / jasmin-http-api 等。
apiVersion: v1
kind: ConfigMap
metadata:
  name: jasmin-web-config
  namespace: jasmin
data:
  DJANGO_SETTINGS_MODULE: "config.settings.pro"
  # 见顶部说明:bool("0")==True => 实际 DEBUG=True(static() 吐静态资源所需)
  DEBUG: "0"
  ALLOWED_HOSTS: "*"
  TIME_ZONE: "UTC"
  LANGUAGE_CODE: "en"

  # Redis(复用集群内 redis-server;用 DB 1 与 jasmin-core 的 DB 0 隔离)
  REDIS_HOST: "redis-server"
  REDIS_PORT: "6379"
  REDIS_DB: "1"

  # jCli telnet —— 面板下发管理命令的主通道(指向 jasmin-cli 这个 NodePort 服务的 ClusterIP)
  TELNET_HOST: "jasmin-cli"
  TELNET_PORT: "8990"
  TELNET_USERNAME: "jcliadmin"
  TELNET_TIMEOUT: "10"

  # HTTP 发送 API(可选)
  HTTP_HOST: "http://jasmin-http-api"
  HTTP_PORT: "1401"

  # SMPP 发送(可选)
  SMPP_HOST: "jasmin-smpp-api"
  SMPP_PORT: "2775"

  # 提交日志页面开关(=1 开启;数据需另跑 sms_logger,见文件末尾)
  SUBMIT_LOG: "1"

  # REST API 限流
  API_THROTTLE_ANON: "20/minute"
  API_THROTTLE_USER: "120/minute"
---
apiVersion: v1
kind: Secret
metadata:
  name: jasmin-web-secret
  namespace: jasmin
type: Opaque
stringData:
  # !!! 生产环境务必修改 SECRET_KEY !!!
  SECRET_KEY: "change-me-8na#(#x@0i*3ah%&$-q)b&wqu5ct_a3))d8-sqk-ux"
  # Django 业务库连接串(用户/密码/库名需与下方 jasmin-webdb-secret 一致)
  PRODB_URL: "postgres://jasmin:jasmin@jasmin-webdb:5432/jasmin"
  # jCli 密码(对应 jasmin-core 启动参数 -p jclipwd)
  TELNET_PW: "jclipwd"
---
apiVersion: v1
kind: Secret
metadata:
  name: jasmin-webdb-secret
  namespace: jasmin
type: Opaque
stringData:
  POSTGRES_DB: "jasmin"
  POSTGRES_USER: "jasmin"
  POSTGRES_PASSWORD: "jasmin"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jasmin-webdb-init
  namespace: jasmin
data:
  # 仅在数据目录首次初始化时执行一次。
  init.sql: |
    -- PG15+ 默认收回了 public schema 上 PUBLIC 的 CREATE 权限,
    -- 这里补回给库 owner,好让 Django migrate 能建表。
    GRANT USAGE, CREATE ON SCHEMA public TO CURRENT_USER;
# ============================================================================
# 可选:提交日志采集器(sms_logger)
# ----------------------------------------------------------------------------
# 上面的 SUBMIT_LOG=1 只是「打开面板里的提交日志页面」,真正往 submit_log 表里写
# 数据的是 sms_logger:它消费 jasmin 的 RabbitMQ「messaging」交换机,把每条
# submit_sm / DLR 落库到本面板的 PostgreSQL(表 submit_log,Django 迁移已建好)。
#
# 本集群默认未部署它(它依赖 jasmin-web-panel 仓库里的 sms_logger.py,且需运行时
# pip 安装 psycopg2)。如需启用,可参考 jasmin-web-panel/docker-compose.yml 的
# sms_logger 服务:用 jookies/jasmin 镜像,把 sms_logger.py 经 ConfigMap 挂入,
# 并设置 DB_HOST=jasmin-webdb / AMQP_BROKER_HOST=rabbitmq-broker 等环境变量。
# 不部署也不影响「页面管理」本身,仅提交日志页面为空。
# ============================================================================
